name: currency-converter-api-test

services:
  db-test:
    image: postgres:18
    container_name: converter-db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: currency_converter_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d currency_converter_test']
      interval: 2s
      timeout: 3s
      retries: 15
