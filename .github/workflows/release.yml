name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: O tag aponta para um commit da main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O tag $GITHUB_REF_NAME não aponta para um commit da main"
            exit 1
          fi

      - name: A versão do package.json é a mesma do tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$version" ]; then
            echo "::error::package.json está na versão $package_version, mas o tag é $GITHUB_REF_NAME"
            exit 1
          fi

      - name: O CHANGELOG tem a seção da versão
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}"

  quality:
    name: Lint + format
    needs: preflight
    uses: ./.github/workflows/ci.yml

  tests:
    name: Testes
    needs: quality
    uses: ./.github/workflows/tests.yml

  release:
    name: GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Cria o release com a seção do CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
